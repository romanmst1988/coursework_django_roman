{% extends 'mailer/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<h3>Удалить сообщение "{{ object.subject }}"?</h3>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailer:message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
