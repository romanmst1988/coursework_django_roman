{% extends 'mailer/base.html' %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<h1>Сообщения</h1>

<a href="{% url 'mailer:message_create' %}" class="btn btn-primary mb-3">Создать сообщение</a>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Тема</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    {% for msg in object_list %}
        <tr>
            <td>{{ msg.id }}</td>
            <td>{{ msg.subject }}</td>
            <td>
                <a href="{% url 'mailer:message_detail' msg.id %}" class="btn btn-sm btn-info">Подробнее</a>
                <a href="{% url 'mailer:message_update' msg.id %}" class="btn btn-sm btn-warning">Редактировать</a>
                <a href="{% url 'mailer:message_delete' msg.id %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">Сообщений нет</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
