{% extends 'mailer/base.html' %}

{% block content %}
<h2>{{ form.instance.pk|yesno:"Редактировать рассылку,Создать рассылку" }}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'mailer:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
