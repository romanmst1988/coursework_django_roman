{% extends 'mailer/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>
        {% if object %}
            Редактировать сообщение
        {% else %}
            Создать сообщение
        {% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'mailer:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
