{% extends 'mailer/base.html' %}

{% block content %}
<h3>Удалить рассылку №{{ object.id }}?</h3>

<form method="post">

    <a class="btn btn-secondary" href="{% url 'mailer:mailing_list' %}">Отмена</a>
</form>
{% endblock %}
