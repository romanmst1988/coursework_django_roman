{% extends 'mailer/base.html' %}

{% block content %}
<h2>Профиль пользователя</h2>

<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Имя:</strong> {{ user.first_name }}</p>
<p><strong>Телефон:</strong> {{ user.phone_number }}</p>
<p><strong>Страна:</strong> {{ user.country }}</p>

{% if user.avatar %}
    <p><strong>Аватар:</strong></p>
    <img src="{{ user.avatar.url }}" width="150">
{% endif %}

{% endblock %}
