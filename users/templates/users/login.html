{% extends 'mailer/base.html' %}
{% block content %}
<h2>Вход</h2>

<form method="post" action="{% url 'users:login' %}">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Войти</button>
</form>

<p>Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>

{% endblock %}
